name: Auto Reply to New Issue

on:
  issues:
    types:
      - opened

jobs:
  add-response:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Add autoresponse
        uses: derekprior/add-autoresponse@latest
        with:
          respondableId: ${{ github.event.issue.node_id }}
          response: |
            Thanks for opening this issue! We've received your report and will look into it shortly.
            In the meantime, you can check our [documentation](link-to-your-docs) for potential solutions.
